[project]
name = "macrotrack"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Valeriy Tuhashvili", email = "vtuhashvili98@mail.ru" }
]
requires-python = ">=3.14"
dependencies = []

[project.scripts]
macrotrack = "macrotrack:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "ruff>=0.17.4",
]

[tool.ruff]
target-version = "py314"
line-length = 88

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.mypy]
python_version = "3.14"
strict = true
files = ["src/macrotrack"]
